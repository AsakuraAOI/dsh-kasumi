- id: hiagent-query-budget
  disabled: false
  config:
    enabled: true
    verificationPath: !!js process.env.DSH_HIAGENT_VERIFICATION
    upstream: https://api.asakuraaoi.cn/anthropic
    admissionBytes: 810000
    path: !!js ctx.profileContext.dir + '/query-budget.jsonl'
- id: llm-pi-ai
  inject:
    - hiagentQueryBudget
  config:
    providers:
      hiagent:
        apiKeyEnv: HIAGENT_API_KEY
        api: anthropic-messages
        baseURL: !!js ctx.hiagentQueryBudget.url + '/agent'
        defaultMaxTokens: 8192
        timeoutMs: 330000
        streamIdleTimeoutMs: 330000
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek Flash（Query 预算保护）
            input:
              - text
            contextWindow: 224000
        retryPolicy:
          mode: normal
          maxRetries: 1
          retryableCodes:
            - RATE_LIMIT
      hiagent-summary:
        apiKeyEnv: HIAGENT_API_KEY
        api: anthropic-messages
        baseURL: !!js ctx.hiagentQueryBudget.url + '/summary'
        defaultMaxTokens: 8192
        timeoutMs: 330000
        streamIdleTimeoutMs: 330000
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek Flash（Query 预算保护）
            input:
              - text
            contextWindow: 224000
        retryPolicy:
          mode: normal
          maxRetries: 1
          retryableCodes:
            - RATE_LIMIT
- id: agent-preset-registry
  config:
    default: hiagent-balanced-optimized
- id: hiagent-observability
  config:
    enabled: true
    providers:
      - hiagent
      - hiagent-summary
    path: !!js ctx.profileContext.dir + '/metrics.jsonl'
- id: preset-hiagent-lite-optimized
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: hiagent-lite-optimized
    name: Kasumi 轻量版
    description: 持久化终端与精确编辑，增加项目指令、轻量压缩和输出预算；额外搜索默认关闭。
    order: 30
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {cwd}.
          prefix: >-
            You are a coding agent powered by the {model} model.


            You are a reliable coding agent operating through a slow, prompt-mediated Kasumi tool gateway.


            Your primary objective is to maximize verified progress per model generation.


            Execution rules:


            1. Prefer small, complete, verifiable actions over large one-shot operations.

            2. Tool-call generation is expensive. Target fewer than 1500 generated tokens per tool call, and
            avoid calls approaching or exceeding 2000 tokens.

            3. When tool use is necessary, invoke the appropriate tool directly without preliminary narration.

            4. Use only tools actually exposed by the current harness. Follow their exact argument schemas.

            5. 工具调用严格遵循当前提供的传输格式和工具 Schema。协议内容仅用于真实工具调用，不在面向用户的说明中复述；不得伪造调用或执行结果。

            6. For existing files, prefer targeted edit or replace operations over full-file rewrites.

            7. Inspect only relevant code regions. Avoid dumping entire large files, logs, or directories.

            8. Break large file creation, refactoring, or migration tasks into multiple smaller operations.

            9. After making changes, verify them using the smallest relevant check.

            10. If an operation fails or appears truncated, reduce its scope before retrying. Do not repeat
            the same oversized operation.

            11. Never claim that a tool executed successfully unless its result confirms success.

            12. Do not fabricate tool results, file contents, test outcomes, or available capabilities.

            13. Do not depend on hidden or signed reasoning blocks.

            14. Do not attempt upstream server-side tool execution.

            15. Avoid unnecessary explanations, repeated plans, and verbose status messages.

            16. Do not sacrifice correctness or safety merely to shorten output.


            When the task is simple, act immediately. When it is complex, divide it into concrete, manageable
            steps and execute them incrementally.


            Use the user's language for explanations and final responses.


            At completion, briefly report what changed, what was verified, and any unresolved issues.


            Use the smallest number of tool interactions necessary. Favor direct shell inspection and precise
            file edits. Avoid auxiliary planning, elaborate orchestration, and unnecessary intermediate
            output.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 32768
      - id: tool-presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: native
      - id: persistent-shell
        name: cordis:group
        group: true
        isolate:
          terminals: true
        config:
          - id: pty
            name: '@deepseek-ai/dsh-terminal'
          - id: terminal-bash
            name: '@deepseek-ai/dsh-terminal-bash'
            disabled: !!js process.platform === 'win32'
            config:
              timeoutMs: 300000
          - id: persistent-bash
            name: '@deepseek-ai/dsh-tool-bash-persistent'
            disabled: !!js process.platform === 'win32'
            config:
              timeoutMs: 300000
          - id: terminal-pwsh
            name: '@deepseek-ai/dsh-terminal-bash'
            disabled: !!js process.platform !== 'win32'
            config:
              shellDialect: pwsh
              timeoutMs: 300000
          - id: persistent-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh-persistent'
            disabled: !!js process.platform !== 'win32'
            config:
              timeoutMs: 300000
      - id: tool-str-replace-editor
        name: '@deepseek-ai/dsh-tool-str-replace-editor'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@local/dsh-kasumi/compaction'
            config:
              thresholdRatio: 0.75
              headroomTokens: 65536
              retainRatio: 0.16
              maxTokens: 8192
              compactionRetries: 0
              maxOverflowRetries: 1
              plainText: true
              maxSummaryAttemptsPerSurface: 2
              summarizationProvider: hiagent-summary
              summarizationModel: deepseek-v4.1-flash
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
        disabled: false
      - id: hiagent-output-budget
        name: '@local/dsh-kasumi/output-budget'
        config:
          enabled: true
