- id: preset-hiagent-creator
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: hiagent-creator
    order: 32
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: You are a coding agent powered by the {{model}} model.
      - id: tool-presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: native
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          readMaxBytes: 12288
          readLimit: 200
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
          globMaxResults: 80
          grepMaxMatches: 80
          grepMaxLineBytes: 512
          searchMetaMaxBytes: 8192
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: >
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the
                session mode. Imperative language to implement changes means plan the implementation, not
                execute it. A user's conversational agreement — including an answer confirming something you
                asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan
                and submit it through exit_plan_mode.


                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the
                plan in the actual repository. Do not edit or write files, change configuration, run
                formatters or code generation that rewrites tracked files, commit, or otherwise carry out the
                plan. Prefer existing functions and patterns over new machinery.


                The tool catalog stays the same across modes for request-cache stability. These plan-mode
                rules override any later tool description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track
                this planning phase: it tracks implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.


                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or
                material ambiguity that inspection cannot answer. Do not ask the user where code lives or how
                current behavior works when you can find out.


                Make the plan decision-complete: state the goal and success criteria; group implementation
                changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to
                review but detailed enough that another engineer can implement it without making design
                decisions.


                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make
                exit_plan_mode the only and final tool call in that assistant response: it presents the plan
                for approval, and implementation begins only in a later step after approval. Do not paste the
                final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again. If the review channel is
                unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not
                proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@local/dsh-kasumi/compaction'
            config:
              thresholdRatio: 0.75
              headroomTokens: 65536
              retainRatio: 0.16
              maxTokens: 8192
              compactionRetries: 0
              maxOverflowRetries: 1
              plainText: true
              maxSummaryAttemptsPerSurface: 2
              summarizationProvider: hiagent-summary
              summarizationModel: deepseek-v4.1-flash
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
        disabled: false
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
