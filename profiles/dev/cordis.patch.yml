- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: !!js process.env.DSH_HIAGENT_PRESET || 'hiagent-balanced'
- id: llm-pi-ai
  config:
    providers:
      hiagent:
        apiKeyEnv: HIAGENT_API_KEY
        api: anthropic-messages
        baseURL: https://api.asakuraaoi.cn/anthropic
        defaultMaxTokens: 8192
        timeoutMs: 330000
        streamIdleTimeoutMs: 330000
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            input:
              - text
              - image
            contextWindow: 160000
        retryPolicy:
          mode: normal
          maxRetries: 1
          retryableCodes:
            - RATE_LIMIT
          backoff:
            initialDelayMs: 1000
            maxDelayMs: 10000
            jitterRatio: 0.1
- id: agent-default-model
  config:
    provider: hiagent
    model: deepseek-v4.1-flash
- id: session-title-llm
  disabled: true
- id: hiagent-recovery
  disabled: false
- id: session-persistence-jsonl
  config:
    root: !!js ctx.profileContext.dir + '/sessions'
- id: spill-local
  config:
    root: !!js ctx.profileContext.dir + '/spill'
    cleanupPeriodDays: 7
- insert:
    - id: hiagent-dev-preset-mount
      name: '@local/dsh-kasumi-dev-profile'
